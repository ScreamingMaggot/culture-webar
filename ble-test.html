<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Bluetooth 支持探测</title>
  <style>
    body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #111; color: #eee; padding: 18px; }
    h3 { margin-top: 0; }
    button { padding: 14px 22px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; background: #2f6fed; cursor: pointer; }
    #log { margin-top: 14px; white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; color: #9fe870; background: #000; padding: 12px; border-radius: 8px; line-height: 1.6; }
    .hint { font-size: 13px; color: #ffd479; line-height: 1.6; margin-top: 14px; }
  </style>
</head>
<body>
  <h3>Web Bluetooth 支持探测</h3>
  <div>UA：<span id="ua" style="font-size:12px;color:#8ab4f8;word-break:break-all"></span></div>
  <div class="row" style="margin:14px 0"><button id="b">测试 Web Bluetooth</button></div>
  <div id="log">初始化…</div>
  <p class="hint">
    在<b>夸克</b>和 <b>Chrome</b> 各开一次本页，点按钮，把结果截图/复述：<br>
    · 若显示"navigator.bluetooth 存在? false" → 该浏览器不支持蓝牙，AR 与蓝牙无法在同浏览器共存。<br>
    · 若存在、点按钮弹出"选择设备"列表(哪怕为空) → 支持！取消即可，说明能继续对接 ESP32。<br>
    · 报 SecurityError/NotSupportedError → 需 https(本页已 https)或该内核未开放。
  </p>
  <script>
    const log = (s) => { const el = document.getElementById('log'); el.textContent += '\n' + s; };
    document.getElementById('ua').textContent = navigator.userAgent;
    log('navigator.bluetooth 存在? ' + ('bluetooth' in navigator));
    document.getElementById('b').addEventListener('click', async () => {
      if (!navigator.bluetooth) { log('❌ 本浏览器不支持 Web Bluetooth（navigator.bluetooth 不存在）'); return; }
      log('navigator.bluetooth 存在，尝试 requestDevice…');
      try {
        const d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['battery_service'] });
        log('✅ 弹出选择并选到设备: ' + (d.name || '(无名)') + '  id=' + (d.id || '').slice(0, 8));
        log('→ 结论：该浏览器支持 Web Bluetooth，可继续对接 ESP32');
      } catch (e) {
        if (e.name === 'NotFoundError') log('ℹ 弹出选择器但被取消/无设备(NotFoundError) → 说明 API 可用、浏览器支持');
        else log('requestDevice 结束: ' + e.name + ' — ' + e.message);
      }
    });
  </script>
</body>
</html>
