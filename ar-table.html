<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>龙马 AR 桌面（四角标定 + 透视一致的虚拟相机）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
    #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #gl { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }
    #calib { position: fixed; inset: 0; z-index: 5; touch-action: none; }
    #calib.hidden { display: none; }
    .corner { position: absolute; width: 34px; height: 34px; margin: -17px; border-radius: 50%; background: rgba(47,111,237,.85); border: 2px solid #fff; cursor: grab; }
    #cline { position: absolute; inset: 0; pointer-events: none; }
    #bar { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 6; background: rgba(0,0,0,.65); padding: 8px 10px; border-radius: 10px; font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #bar input { width: 56px; padding: 6px; border-radius: 6px; border: 1px solid #444; background: #111; color: #eee; }
    #bar button { padding: 8px 12px; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; font-weight: 700; cursor: pointer; }
    #bar button.gray { background: #333; }
    #panel { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 6; display: none; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 10px; font-size: 12px; }
    #panel input[type=range] { width: 90px; vertical-align: middle; }
    #st { position: fixed; top: 56px; left: 8px; right: 8px; z-index: 6; text-align: center; font-size: 13px;
          color: #9fe870; background: rgba(0,0,0,.66); padding: 6px 8px; border-radius: 8px; }
    #st.warn { color: #ffd479; }
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14161a; text-align: center; padding: 24px; }
    #start select { padding: 10px; border-radius: 10px; background: #22252b; color: #eee; border: 1px solid #444; }
    #start button { padding: 14px 26px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700; color: #fff; background: #2f6fed; cursor: pointer; }
    .hint { font-size: 13px; color: #ffd479; line-height: 1.6; max-width: 380px; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <canvas id="gl"></canvas>

  <div id="start">
    <h3>龙马 AR 桌面 <span style="font-size:12px;color:#8ab4f8">版本 T2026-10-19h</span></h3>
    <div class="hint">固定机位对准桌面 → 启动 → 把 4 个蓝点拖到桌面一个已知真实尺寸的矩形四角 → 填 宽×深(米) → 点“标定”。<br>
      <b>标定完成后龙马才出现</b>：它的底面就落在四角围出的桌面上，渲染透视由这四个点解出的虚拟相机决定，与画面里的桌面一致。</div>
    <div><select id="cam"></select></div>
    <button id="go">启动摄像头</button>
  </div>

  <div id="calib" class="hidden">
    <svg id="cline"><polygon id="quad" fill="rgba(47,111,237,.12)" stroke="#2f6fed" stroke-width="2" points=""></polygon></svg>
    <div class="corner" id="c0"></div><div class="corner" id="c1"></div><div class="corner" id="c2"></div><div class="corner" id="c3"></div>
  </div>
  <div id="st">模型加载中…</div>
  <div id="bar" style="display:none">
    <label>宽(米)<input id="W" type="number" value="0.6" step="0.1"></label>
    <label>深(米)<input id="D" type="number" value="0.4" step="0.1"></label>
    <button id="cal">标定</button>
    <button id="recal" class="gray">重标四角</button>
    <span id="mode" style="margin-left:auto"></span>
  </div>
  <div id="panel">
    <label>真实高度(米) <input id="sSize" type="range" min="0.05" max="0.8" step="0.01" value="0.3"></label>
    <label>速度(m/s) <input id="sSpeed" type="range" min="0.05" max="1.5" step="0.05" value="0.3"></label>
    <span style="color:#9fe870">点桌面让龙马走</span>
  </div>

  <script type="importmap">
  { "imports": {
    "three": "./samples/three-webxr-hittest/libs/three.module.js",
    "three/addons/": "./samples/three-webxr-hittest/libs/jsm/"
  } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { homography, poseFromHomography, rectCorners, inv3, applyH } from './tablepose.js?v=T2026-10-19h';

    const stEl = document.getElementById('st'), modeEl = document.getElementById('mode');
    const setSt = (t, warn) => { stEl.textContent = t; stEl.classList.toggle('warn', !!warn); };
    const Wm = () => parseFloat(document.getElementById('W').value);
    const Dm = () => parseFloat(document.getElementById('D').value);

    // ---- 三维场景：世界坐标 = 桌面坐标（x 桌宽、y 向上、z 桌深），模型底面在 y=0 ----
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));
    const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(0.4, 2, 1); scene.add(dl);
    function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    // ---- 载入龙马：底面对齐 y=0、水平居中，高度归一到 1（渲染时按"真实高度(米)"缩放）----
    let holder = null;
    const draco = new DRACOLoader(); draco.setDecoderPath('./samples/three-webxr-hittest/libs/jsm/libs/draco/gltf/');
    const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
    loader.load('./assets/a19.min.glb', g => {
      const model = g.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3(); box.getSize(size);
      const c = new THREE.Vector3(); box.getCenter(c);
      // 关键：平移量必须和缩放放在同一层。
      // 若把 scale 加在 model（子节点）上，model.position 不会被它自己的缩放影响——
      // 这个模型的包围盒是 214×155×125、中心 (6.6,0,62.7)，平移 77.7 单位后
      // 再乘 holder 的米制缩放，会落到桌上 20 多米外，看上去就是"没有模型"。
      model.position.set(-c.x, -box.min.y, -c.z);
      const hy = (size.y > 0.3 * Math.max(size.x, size.y, size.z)) ? size.y : Math.max(size.x, size.y, size.z);
      const unit = new THREE.Group();                    // 归一化层：缩放与平移同层
      unit.scale.setScalar(1 / hy);
      unit.add(model);
      holder = new THREE.Group();                        // 米制层：holder.scale 就是真实高度（米）
      holder.add(unit); holder.visible = false; scene.add(holder);
      modeEl.textContent = '模型就绪';
      if (!H) setSt('模型已就绪 · 尚未标定 → ① 拖四角 ② 填宽深 ③ 点“标定”', true);
    }, undefined, (e) => {
      modeEl.textContent = '模型加载失败';
      setSt('模型加载失败：' + ((e && e.message) || e) + '（检查网络后刷新）', true);
    });

    // ---- 摄像头 ----
    const AUTO = '__auto__', sel = document.getElementById('cam');
    const BAD = /privacy|virtual|obs|parsec|emulator|hello|3d\s*sr|背景|blur|bokeh/i;
    const sc = d => { const l = (d.label || '').toLowerCase(); if (BAD.test(l)) return -10; if (/back|environment|rear|后置|主摄|wide/i.test(l)) return 30; if (/front|user|face|前置/i.test(l)) return 5; return 20; };
    async function list() { let d = []; try { d = (await navigator.mediaDevices.enumerateDevices()).filter(x => x.kind === 'videoinput'); } catch (e) {} sel.replaceChildren(); const o0 = document.createElement('option'); o0.value = AUTO; o0.textContent = '自动'; sel.appendChild(o0); d.sort((a, b) => sc(b) - sc(a)); d.forEach((x, i) => { const o = document.createElement('option'); o.value = x.deviceId; o.textContent = x.label || ('摄像头' + i); sel.appendChild(o); }); if (d[0]) sel.value = d[0].deviceId; }
    list();
    let chosen = null;
    const md = navigator.mediaDevices, orig = md.getUserMedia.bind(md);
    md.getUserMedia = function (c) { c = Object.assign({}, c); if (c.video) c.video = (chosen && chosen !== AUTO) ? { deviceId: { exact: chosen } } : true; return orig(c); };
    document.getElementById('go').addEventListener('click', async () => {
      chosen = sel.value; let stream;
      try { stream = await md.getUserMedia({ video: true }); } catch (e) { alert('摄像头失败 ' + e.name); return; }
      const video = document.getElementById('v'); video.srcObject = stream; await video.play().catch(() => {});
      document.getElementById('start').style.display = 'none';
      document.getElementById('calib').classList.remove('hidden');
      document.getElementById('bar').style.display = 'flex';
      resetCorners();
      modeEl.textContent = '① 拖四角 ② 填宽深 ③ 点标定';
      if (holder) setSt('模型已就绪 · 尚未标定 → ① 拖四角 ② 填宽深 ③ 点“标定”', true);
    });

    // ---- 四角拖拽（归一化屏幕坐标）----
    let corners = [[0.2, 0.35], [0.8, 0.35], [0.85, 0.8], [0.15, 0.8]], drag = -1;
    function renderCorners() {
      const W = innerWidth, H = innerHeight, px = corners.map(c => [c[0] * W, c[1] * H]);
      document.getElementById('quad').setAttribute('points', px.map(p => p.join(',')).join(' '));
      px.forEach((p, i) => { const e = document.getElementById('c' + i); e.style.left = p[0] + 'px'; e.style.top = p[1] + 'px'; });
    }
    function resetCorners() { corners = [[0.2, 0.35], [0.8, 0.35], [0.85, 0.8], [0.15, 0.8]]; renderCorners(); }
    const calib = document.getElementById('calib');
    calib.addEventListener('pointerdown', e => { const id = e.target.id; if (id && id[0] === 'c') drag = +id[1]; });
    window.addEventListener('pointermove', e => { if (drag < 0) return; corners[drag] = [e.clientX / innerWidth, e.clientY / innerHeight]; renderCorners(); });
    window.addEventListener('pointerup', () => drag = -1);
    window.addEventListener('resize', renderCorners);
    document.getElementById('recal').addEventListener('click', () => {
      calib.classList.remove('hidden'); document.getElementById('panel').style.display = 'none';
      H = null; pose = null; if (holder) holder.visible = false; ring.visible = false;
      modeEl.textContent = '① 拖四角 ② 填宽深 ③ 点标定';
      setSt('未标定 · 龙马暂不显示', true); resetCorners();
    });

    // ---- 标定：四点解单应 → 分解出与桌面透视一致的虚拟相机 ----
    let H = null, Hinv = null, pose = null;
    let cur = { x: 0, z: 0 }, tgt = null, speed = 0.3, sizeK = 0.3;

    // 桌面上的定位环：即使模型本身有问题，也能看出"平面放对了没有"
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.055, 0.07, 32),
      new THREE.MeshBasicMaterial({ color: 0x36d17a, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.visible = false; scene.add(ring);

    function applyPose(p) {
      // R 是 world→camera（CV：y 下、z 朝前）。three 相机 y 上、z 朝后：相机世界旋转 = Rᵀ·diag(1,-1,-1)
      const m = new THREE.Matrix4().set(
        p.R[0], p.R[1], p.R[2], 0,
        p.R[3], p.R[4], p.R[5], 0,
        p.R[6], p.R[7], p.R[8], 0,
        0, 0, 0, 1);
      m.transpose().multiply(new THREE.Matrix4().makeScale(1, -1, -1));
      camera.quaternion.setFromRotationMatrix(m);
      camera.position.set(p.C[0], p.C[1], p.C[2]);
      camera.fov = 2 * Math.atan((innerHeight / 2) / p.f) * 180 / Math.PI;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld(true);
    }

    // 用 three 相机把四个桌角投回屏幕，与拖出来的像素比：整条链路的现场自检
    function reprojectErrorPx() {
      let worst = 0;
      rectCorners(Wm(), Dm()).forEach((p, i) => {
        const v = new THREE.Vector3(p[0], p[1], p[2]).project(camera);
        const u = (v.x * 0.5 + 0.5) * innerWidth, vv = (-v.y * 0.5 + 0.5) * innerHeight;
        worst = Math.max(worst, Math.hypot(u - corners[i][0] * innerWidth, vv - corners[i][1] * innerHeight));
      });
      return worst;
    }

    document.getElementById('cal').addEventListener('click', () => {
      const w = Wm(), d = Dm();
      if (!(w > 0 && d > 0)) { alert('填有效的宽/深（米）'); return; }
      const src = rectCorners(w, d).map(p => [p[0], p[2]]);
      const dst = corners.map(c => [c[0] * innerWidth, c[1] * innerHeight]);
      const h = homography(src, dst);
      if (!h) { alert('四点退化（共线或重合），请重拖'); return; }
      const p = poseFromHomography(h, innerWidth, innerHeight, 60);
      if (!p.ok) { alert('标定失败：' + (p.why || '位姿解不出')); return; }
      H = h; Hinv = inv3(h); pose = p;
      cur = { x: 0, z: 0 }; tgt = null;
      calib.classList.add('hidden');
      document.getElementById('panel').style.display = 'block';
      modeEl.textContent = '已标定';
      applyPose(p);                                     // 近似解也要用（它是当前四点下的最佳拟合）
      const err = reprojectErrorPx();
      // 再把"模型中心"投一次屏：复投对只说明相机贴合四角，位置还得单独看
      const cc = new THREE.Vector3(0, 0, 0).project(camera);
      const cu = (cc.x * 0.5 + 0.5) * innerWidth, cv = (-cc.y * 0.5 + 0.5) * innerHeight;
      const onScreen = cu > 0 && cu < innerWidth && cv > 0 && cv < innerHeight;
      if (p.approx) {
        setSt('已标定（近似）· 四点不像同一矩形的透视，视场按默认值；若透视不对请重拖四角', true);
      } else {
        setSt('已标定 · 四角复投误差 ' + err.toFixed(2) + ' 像素 · 模型中心屏位 ('
          + Math.round(cu) + ',' + Math.round(cv) + ')' + (onScreen ? '' : ' ⚠ 不在画面内，请重标')
          + ' · 点桌面让龙马走', err > 3 || !onScreen);
      }
    });

    document.getElementById('sSpeed').addEventListener('input', e => speed = +e.target.value);
    document.getElementById('sSize').addEventListener('input', e => sizeK = +e.target.value);

    // 点击 → 像素经 H⁻¹ 回到桌面坐标（米）
    window.addEventListener('pointerdown', ev => {
      if (!H || !Hinv) return;
      if (ev.target && ev.target.closest && ev.target.closest('#bar,#panel,#start,#calib')) return;
      const [x, z] = applyH(Hinv, ev.clientX, ev.clientY);
      if (Number.isFinite(x) && Number.isFinite(z)) tgt = { x, z };
    });

    function place() {
      if (!holder || !H) return;
      holder.visible = true;
      holder.position.set(cur.x, 0, cur.z);
      holder.scale.setScalar(sizeK);                    // 模型高度归一到 1，这里就是真实高度（米）
      if (tgt) holder.rotation.y = -Math.atan2(tgt.z - cur.z, tgt.x - cur.x) + Math.PI / 2;
      ring.position.set(cur.x, 0.002, cur.z);
      ring.visible = true;
    }

    let last = 0;
    (function loop(ts) {
      requestAnimationFrame(loop);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0; last = ts;
      if (tgt && H) {
        const dx = tgt.x - cur.x, dz = tgt.z - cur.z, dist = Math.hypot(dx, dz);
        if (dist < 0.005) { tgt = null; } else {
          const st = Math.min(speed * dt, dist) / dist;
          cur.x += dx * st; cur.z += dz * st;
        }
      }
      place();
      renderer.render(scene, camera);
    })(0);
  </script>
</body>
</html>
