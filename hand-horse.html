<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>龙马 · 张开手掌站在掌心</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
    #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; transform: scaleX(-1); }
    #gl { position: fixed; inset: 0; z-index: 1; width: 100%; height: 100%; }
    #hud { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 9; font: 14px system-ui,"Microsoft YaHei",sans-serif; color: #9fe870; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 8px; }
    #fn { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 10; display: none; font: 18px/1.4 system-ui,"Microsoft YaHei",sans-serif; font-weight: 700; color: #fff; background: rgba(47,111,237,.9); padding: 10px 18px; border-radius: 12px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14161a; text-align: center; padding: 24px; }
    #start select { padding: 10px; border-radius: 10px; background: #22252b; color: #eee; border: 1px solid #444; }
    #start button { padding: 14px 26px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700; color: #fff; background: #2f6fed; cursor: pointer; }
    #start .hint { font-size: 13px; color: #ffd479; max-width: 360px; line-height: 1.6; }
    #panel { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 9; display: none; font-size: 12px; color: #eee; background: rgba(0,0,0,.5); padding: 6px 8px; border-radius: 8px; }
    #panel input[type=range]{ width: 90px; vertical-align: middle; }
    #cmdrow { margin-top: 5px; }
    .bcmd { width: 30px; text-align: center; background: #000; color: #9fe870; border: 1px solid #444; border-radius: 4px; font: 12px ui-monospace, Consolas, monospace; padding: 2px; }
    .bsend { background: #149f5a; border: 0; border-radius: 4px; color: #fff; font-size: 11px; padding: 3px 7px; margin: 0 8px 0 2px; cursor: pointer; }
    #bt { position: fixed; top: 8px; right: 8px; z-index: 11; font: 12px system-ui,"Microsoft YaHei",sans-serif; color: #fff; background: rgba(0,0,0,.65); padding: 7px 10px; border-radius: 8px; border: 1px solid #555; cursor: pointer; max-width: 44vw; }
    #rx { position: fixed; left: 8px; right: 8px; bottom: 44px; z-index: 10; font: 12px ui-monospace, Consolas, monospace; color: #7fd0ff; background: rgba(0,0,0,.6); padding: 5px 8px; border-radius: 7px; text-align: center; }
    #bt.on { border-color: #37d067; color: #9fe870; }
    #bt select { background:#22252b; color:#eee; border:1px solid #444; border-radius:6px; padding:2px; margin-top:4px; max-width: 150px; }
    #start button.bt { background:#149f5a; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <canvas id="gl"></canvas>
  <div id="hud">正在加载…</div>
  <div id="fn"></div>
  <div id="rx">串口回读：（还没有数据）</div>
  <div id="bt">蓝牙：未连接</div>

  <div id="start">
    <h3>龙马 · 张开手掌站在掌心</h3>
    <div class="hint">启动摄像头（建议用前置）→ 对着镜头<b>张开五指</b> → 龙马实时站在掌心、跟随手心朝向；<b>点屏幕任意处</b>，龙马会平滑走到你点的地方、头朝行进方向。</div>
    <select id="cam"></select>
    <button id="go">启动摄像头</button>
    <button id="goBT" class="bt">连接蓝牙（DX-BT24，可跳过）</button>
  </div>

  <div id="panel">
    大小 <input id="sScale" type="range" min="0.2" max="3" step="0.05" value="1">
    转正 <input id="sYaw" type="range" min="0" max="360" step="15" value="0">
    俯仰° <input id="sPitch" type="range" min="-60" max="60" step="5" value="0">
    掌轴° <input id="sRoll" type="range" min="0" max="360" step="15" value="270">
    <div id="cmdrow">
      指令字节(十六进制，空＝只屏显不发)：
      跳舞 <input class="bcmd" id="bDance" data-key="dance" maxlength="2" size="2"><button class="bsend" data-key="dance">发</button>
      唱歌 <input class="bcmd" id="bSing" data-key="sing" maxlength="2" size="2"><button class="bsend" data-key="sing">发</button>
      科普 <input class="bcmd" id="bSci" data-key="science" maxlength="2" size="2"><button class="bsend" data-key="science">发</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": {
    "three": "./samples/three-webxr-hittest/libs/three.module.js",
    "three/addons/": "./samples/three-webxr-hittest/libs/jsm/"
  } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { BleClient, hex } from './ble.js';

    const AUTO='__auto__', sel=document.getElementById('cam');
    const BAD=/privacy|virtual|obs|parsec|emulator|hello|3d\s*sr|背景|blur|bokeh/i;
    // 优先前置（手部自拍视角）
    const score=d=>{const l=(d.label||'').toLowerCase();if(BAD.test(l))return -10;if(/front|user|face|前置/i.test(l))return 40;if(/back|environment|rear|后置/i.test(l))return 20;return 25;};
    async function list(){let d=[];try{d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');}catch(e){}
      sel.replaceChildren();const o0=document.createElement('option');o0.value=AUTO;o0.textContent='自动';sel.appendChild(o0);
      d.sort((a,b)=>score(b)-score(a));d.forEach((x,i)=>{const o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||('摄像头'+i);sel.appendChild(o);});if(d[0])sel.value=d[0].deviceId;}
    list();

    const hud=document.getElementById('hud');
    const video=document.getElementById('v');
    const canvas=document.getElementById('gl');
    const md=navigator.mediaDevices, orig=md.getUserMedia.bind(md);
    let chosenDevice=null;
    md.getUserMedia=function(c){c=Object.assign({},c); if(c.video) c.video=(chosenDevice&&chosenDevice!==AUTO)?{deviceId:{exact:chosenDevice}}:true; return orig(c);};

    // ---- three.js 场景（透明，叠在视频上）----
    const renderer=new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    const scene=new THREE.Scene();
    const fov=60;
    const camera=new THREE.PerspectiveCamera(fov, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0,0,1); camera.lookAt(0,0,0);
    scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,3));
    const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(0.5,1,1); scene.add(dl);

    function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
    addEventListener('resize', resize); resize();

    let horse=null, baseScale=1, yawDeg=0, pitchDeg=0, rollDeg=270, prevNormal=new THREE.Vector3(0,0,1), moveTarget=null, created=false;

    // ---- 手势 → 龙马功能。固件表(talk.c deal())只有 0x09=跳舞；唱歌/科普的字节由王子涵定，
    //      未填则只屏显不发送。三个字节都可在下方"指令字节"框现场改（存 localStorage，免重新部署）。
    //      绝对不要发 0x71（切语音模式会关掉蓝牙）。
    const FN = {
      'Pointing_Up': { key: 'dance',   name: '跳舞', byte: 0x09 },
      'Victory':     { key: 'sing',    name: '唱歌', byte: null },
      'Closed_Fist': { key: 'science', name: '科普', byte: null }
    };
    try { Object.values(FN).forEach(f => { const v = localStorage.getItem('fn' + f.key); if (v !== null) f.byte = v === '' ? null : parseInt(v, 16); }); } catch (e) {}
    const fnEl = document.getElementById('fn');
    let fnHold = 0, fnName = '';

    // ---- 蓝牙：DX-BT24 透传（见 ble.js）。手势触发即向 0xFFE1 写 1 字节，实物电子狗执行。
    const btEl = document.getElementById('bt');
    const bt = new BleClient((t, ok) => { btEl.textContent = '蓝牙：' + t; btEl.classList.toggle('on', !!ok); });
    btEl.addEventListener('click', () => bt.connect());
    const goBT = document.getElementById('goBT');
    goBT.addEventListener('click', async () => { if (await bt.connect()) goBT.style.display = 'none'; });
    window.__bt = () => bt.info();
    window.__ble = bt;   // 现场诊断用：可在控制台注入假特征，验"发出=回读"的判定
    let ackToken = 0;   // 只让"最后一次触发"更新屏显，免得迟到的回读把新结果盖掉
    async function showFn(fn) {
      fnEl.style.display = 'block';
      if (fn.byte == null) { fnEl.textContent = '已触发：' + fn.name + ' · 还没给指令字节（只屏显，不发送）'; return; }
      const my = ++ackToken;
      fnEl.textContent = '已触发：' + fn.name + ' · 发出 ' + hex(fn.byte) + ' … 等串口回读';
      const r = await bt.writeAndAck(fn.byte, 2000);
      if (my !== ackToken) return;
      if (!r.sent) { fnEl.textContent = '⚠️ 未发送 ' + hex(fn.byte) + '（' + fn.name + '）· 蓝牙没连上'; return; }
      if (r.ack == null) {
        fnEl.textContent = bt.notifyOk
          ? '❌ 已发 ' + hex(fn.byte) + '（' + fn.name + '），2 秒内串口没回读 → 模块→板子 或板子回写没通'
          : '⚠️ 已发 ' + hex(fn.byte) + '（' + fn.name + '），但这条特征不支持 Notify，读不到回读';
      } else if (r.match) {
        fnEl.textContent = '✅ 链路闭环：发出 ' + hex(fn.byte) + ' ＝ 串口回读 ' + hex(r.ack) + '（' + fn.name + '）· ' + r.waited + 'ms';
      } else {
        fnEl.textContent = '❌ 发出 ' + hex(fn.byte) + '（' + fn.name + '）但串口回读 ' + hex(r.ack) + ' → 不一致';
      }
      renderRx();
    }
    // 串口回读实时窗：不点手势也能看到板子正在推什么上来
    const rxEl = document.getElementById('rx');
    function renderRx() {
      const a = bt.rx, n = bt.rxTotal;
      if (!a.length) { rxEl.textContent = '串口回读：（还没有数据）  连接后板子每写一个字节都会显示在这里'; return; }
      rxEl.textContent = '串口回读 共' + n + '字节：' + a.slice(-14).map(hex).join(' ');
    }
    bt.onRx = renderRx;
    // 指令字节可现场改：会议上一旦定了"唱歌/科普"的字节，手机上填一次即可（存 localStorage，不必重新部署）
    const FN_BY_KEY = {}; Object.values(FN).forEach(f => { FN_BY_KEY[f.key] = f; });
    const toHex = b => b.toString(16).toUpperCase().padStart(2, '0');
    document.querySelectorAll('.bcmd').forEach(inp => {
      const f = FN_BY_KEY[inp.dataset.key];
      inp.value = f.byte == null ? '' : toHex(f.byte);
      inp.addEventListener('change', () => {
        const h = inp.value.replace(/[^0-9a-fA-F]/g, '').slice(0, 2);
        if (!h) { f.byte = null; }
        else {
          const b = parseInt(h, 16);
          if (b === 0x71) { btEl.textContent = '蓝牙：0x71 会关掉蓝牙，已拒绝填入'; inp.value = f.byte == null ? '' : toHex(f.byte); return; }
          f.byte = b;
        }
        inp.value = f.byte == null ? '' : toHex(f.byte);
        try { localStorage.setItem('fn' + f.key, f.byte == null ? '' : toHex(f.byte)); } catch (e) {}
      });
    });
    document.querySelectorAll('.bsend').forEach(btn => btn.addEventListener('click', ev => { ev.stopPropagation(); showFn(FN_BY_KEY[btn.dataset.key]); }));

    const draco=new DRACOLoader(); draco.setDecoderPath('./samples/three-webxr-hittest/libs/jsm/libs/draco/gltf/');
    const loader=new GLTFLoader(); loader.setDRACOLoader(draco);
    window.__loadState='pending';
    loader.load('./assets/a19.min.glb', g => {
      const model=g.scene;
      const box=new THREE.Box3().setFromObject(model);
      const size=new THREE.Vector3(); box.getSize(size);
      const center=new THREE.Vector3(); box.getCenter(center);
      model.position.set(-center.x, -box.min.y, -center.z);
      horse=new THREE.Group(); horse.add(model); horse.visible=false; scene.add(horse);
      baseScale=1/Math.max(size.x,size.y,size.z);
      window.__loadState='ok';
      hud.textContent='✅ 模型就绪：张开五指试试';
    }, (p)=>{ if(p&&p.total) window.__loadState='loading '+Math.round(p.loaded/p.total*100)+'%'; },
       (e)=>{ window.__loadState='err:'+((e&&e.message)||e); hud.textContent='❌ 模型加载失败: '+((e&&e.message)||e); });

    document.getElementById('sScale').addEventListener('input',e=>{});
    document.getElementById('sYaw').addEventListener('input',e=>{ yawDeg=+e.target.value; });
    document.getElementById('sPitch').addEventListener('input',e=>{ pitchDeg=+e.target.value; });
    document.getElementById('sRoll').addEventListener('input',e=>{ rollDeg=+e.target.value; });

    // 屏幕(归一化) → z=0 平面的世界坐标
    function screenToWorld(nx, ny){
      const h=Math.tan(fov/2*Math.PI/180), w=h*camera.aspect;
      return new THREE.Vector3((nx*2-1)*w, (1-ny*2)*h, 0);
    }

    const smoothPos=new THREE.Vector3(); let haveSmooth=false, visible=false;

    // 点击屏幕 → 龙马平移到该点（window 上监听 pointerdown，触摸更可靠）
    window.addEventListener('pointerdown', (ev)=>{
      if(ev.target && ev.target.closest && ev.target.closest('#panel,#hud,#start,#bt')) return;
      const r=renderer.domElement.getBoundingClientRect();
      const nx=(ev.clientX-r.left)/r.width, ny=(ev.clientY-r.top)/r.height;
      moveTarget = screenToWorld(nx, ny);
      hud.textContent='已设目标点 ('+nx.toFixed(2)+','+ny.toFixed(2)+')，龙马走过去…';
    });

    document.getElementById('go').addEventListener('click', async ()=>{
      chosenDevice=sel.value;
      let stream; try{ stream=await md.getUserMedia({video:true}); }catch(e){ hud.textContent='摄像头失败: '+e.name; return; }
      video.srcObject=stream; await video.play().catch(()=>{});
      document.getElementById('start').style.display='none';
      document.getElementById('panel').style.display='block';
      hud.textContent='加载手势模型…';
      const { GestureRecognizer, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const modelPath='https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
      let gr; try{ gr=await GestureRecognizer.createFromOptions(vision,{baseOptions:{modelAssetPath:modelPath,delegate:'GPU'},runningMode:'VIDEO',numHands:1}); }
      catch(e){ gr=await GestureRecognizer.createFromOptions(vision,{baseOptions:{modelAssetPath:modelPath},runningMode:'VIDEO',numHands:1}); }
      hud.textContent='张开五指，让龙马站到掌心';
      let lastT=-1;
      (function loop(){
        requestAnimationFrame(loop);
        const now=performance.now();
        if(video.readyState<2 || video.currentTime===lastT) { renderer.render(scene,camera); return; }
        lastT=video.currentTime;
        let res=null; try{ res=gr.recognizeForVideo(video, now); }catch(e){}
        renderer.render(scene,camera);
        if(!res || !horse){
          const gc = res && res.gestures && res.gestures[0] && res.gestures[0][0];
          hud.textContent = '诊断 res='+(!!res)+' horse='+(!!horse)+' 手势='+(gc?gc.categoryName:'无')+' 手='+((res&&res.landmarks&&res.landmarks[0])?1:0)+' load='+(window.__loadState||'?');
          return;
        }
        const hand=res.landmarks && res.landmarks[0];
        const g=res.gestures && res.gestures[0] && res.gestures[0][0];
        const cat = g ? g.categoryName : '';
        const open = cat==='Open_Palm' && g && g.score>0.4;
        const fn = FN[cat];

        // 功能手势：去抖(连续2帧) → 屏显 + 经 BT24 发单字节指令
        if(fn){
          fnHold++;
          if(fnHold>=2 && fnName!==fn.name){ fnName=fn.name; showFn(fn); }
        } else { fnHold=0; fnName=''; fnEl.style.display='none'; }

        if(open && hand){
          // ① 伸出手掌：产生模型 + 跟随手心
          created=true; moveTarget=null;
          const cx=(hand[0].x+hand[9].x)/2, cy=(hand[0].y+hand[9].y)/2;
          const palm=Math.hypot(hand[9].x-hand[0].x, hand[9].y-hand[0].y);
          const nx=1-cx, ny=cy;
          const wp=screenToWorld(nx, ny);
          if(!haveSmooth){ smoothPos.copy(wp); haveSmooth=true; } else smoothPos.lerp(wp, 0.5);
          const scale=baseScale * palm * 1.4;
          if(Number.isFinite(scale) && scale>1e-6) horse.scale.setScalar(scale * (+document.getElementById('sScale').value));
          horse.position.copy(smoothPos);
          const wl=(res.worldLandmarks && res.worldLandmarks[0]) || hand;
          const dw=(i,j)=> new THREE.Vector3(-(wl[i].x-wl[j].x), -(wl[i].y-wl[j].y), -(wl[i].z-wl[j].z));
          const yAxis=dw(9,0); if(!Number.isFinite(yAxis.x)||yAxis.lengthSq()<1e-12) yAxis.set(0,1,0); yAxis.normalize();
          const across=dw(17,5); if(!Number.isFinite(across.x)||across.lengthSq()<1e-12) across.set(1,0,0); across.normalize();
          const n=new THREE.Vector3().crossVectors(across,yAxis); if(!Number.isFinite(n.x)||n.lengthSq()<1e-12) n.set(0,0,1); n.normalize();
          if(prevNormal && n.dot(prevNormal)<0) n.negate(); prevNormal=n.clone();
          let xAxis=n.clone().negate(); xAxis.sub(yAxis.clone().multiplyScalar(xAxis.dot(yAxis)));
          if(!Number.isFinite(xAxis.x)||xAxis.lengthSq()<1e-6) xAxis.set(0,0,-1); else xAxis.normalize();
          const zAxis=new THREE.Vector3().crossVectors(xAxis,yAxis); if(!Number.isFinite(zAxis.x)||zAxis.lengthSq()<1e-6) zAxis.set(1,0,0); zAxis.normalize();
          let q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis,yAxis,zAxis));
          const off=new THREE.Quaternion().setFromEuler(new THREE.Euler(THREE.MathUtils.degToRad(rollDeg), THREE.MathUtils.degToRad(yawDeg), THREE.MathUtils.degToRad(pitchDeg))); q.multiply(off);
          if(Number.isFinite(q.x)&&Number.isFinite(q.y)&&Number.isFinite(q.z)&&Number.isFinite(q.w)) horse.quaternion.slerp(q, 0.6);
          horse.visible=true;
          hud.textContent='① 手掌跟随 · 手势 '+cat+' ('+Math.round((g.score||0)*100)+'%)';
        } else if(created){
          // ② 其它手势 / 无手：不跟随；点屏幕(鼠标)位移
          if(moveTarget) smoothPos.lerp(moveTarget, 0.35);
          horse.position.copy(smoothPos);
          horse.visible=true;
          if(moveTarget){
            const tv=new THREE.Vector3().subVectors(moveTarget, smoothPos);
            if(tv.length()>0.02){ tv.y=0; tv.normalize();
              const Xw=tv.clone().negate(), Yw=new THREE.Vector3(0,1,0), Zw=new THREE.Vector3().crossVectors(Xw,Yw).normalize();
              horse.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(Xw,Yw,Zw)), 0.3);
            }
          }
          hud.textContent = fn ? ('③ 已触发 «'+fn.name+'» '+(fn.byte!=null?hex(fn.byte):'字节待确认')+'（不跟随）')
                              : (cat ? ('手势 '+cat+'（不跟随）· 可点屏幕移动') : '② 没有手 · 点屏幕让龙马移动');
        } else {
          if(horse) horse.visible=false;
          hud.textContent = cat ? ('手势 '+cat+' — 张开手掌召出龙马') : '张开手掌，让龙马出现';
        }
      })();
    });
  </script>
</body>
</html>
