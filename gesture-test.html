<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>手势识别测试（MediaPipe · 张开手掌触发）</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
    #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #big { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12vw; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #big.on { opacity: 1; }
    #hud { position: fixed; top: 8px; left: 8px; right: 8px; z-index: 9; font: 14px ui-monospace, monospace; color: #9fe870; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; }
    #start { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14161a; text-align: center; padding: 24px; }
    #start select { padding: 10px; border-radius: 10px; background: #22252b; color: #eee; border: 1px solid #444; }
    #start button { padding: 14px 26px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 700; color: #fff; background: #2f6fed; cursor: pointer; }
    #start .hint { font-size: 13px; color: #ffd479; max-width: 340px; line-height: 1.6; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <div id="big">🖐</div>
  <div id="hud">正在加载 MediaPipe…</div>

  <div id="start">
    <h3>手势识别测试</h3>
    <div class="hint">启动摄像头后，把手伸到镜头前：<b>张开五指</b>应显示 🖐 并提示"已触发"；握拳/其他手势不触发。看夸克能不能跑起来、认不认得出。</div>
    <select id="cam"></select>
    <button id="go">启动摄像头</button>
  </div>

  <script type="module">
    import { GestureRecognizer, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    const AUTO='__auto__', sel=document.getElementById('cam');
    const BAD=/privacy|virtual|obs|parsec|emulator|hello|3d\s*sr|背景|blur|bokeh/i;
    const score=d=>{const l=(d.label||'').toLowerCase();if(BAD.test(l))return -10;if(/back|environment|rear|后置|主摄|wide/i.test(l))return 30;if(/front|user|face|前置/i)return 5;return 20;};
    async function list(){let d=[];try{d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');}catch(e){}
      sel.replaceChildren();const o0=document.createElement('option');o0.value=AUTO;o0.textContent='自动';sel.appendChild(o0);
      d.sort((a,b)=>score(b)-score(a));d.forEach((x,i)=>{const o=document.createElement('option');o.value=x.deviceId;o.textContent=x.label||('摄像头'+i);sel.appendChild(o);});if(d[0])sel.value=d[0].deviceId;}
    list();

    const hud=document.getElementById('hud'), big=document.getElementById('big');
    let lastVideoTime=-1, running=false;

    document.getElementById('go').addEventListener('click', async ()=>{
      const chosen=sel.value; const md=navigator.mediaDevices; const orig=md.getUserMedia.bind(md);
      md.getUserMedia=function(c){c=Object.assign({},c);if(c.video)c.video=(chosen&&chosen!==AUTO)?{deviceId:{exact:chosen}}:true;return orig(c);};
      let stream;
      try{stream=await md.getUserMedia({video:true});}catch(e){hud.textContent='摄像头失败: '+e.name;return;}
      const video=document.getElementById('v'); video.srcObject=stream; await video.play().catch(()=>{});
      document.getElementById('start').style.display='none';
      hud.textContent='加载手势模型…（首次可能几秒）';
      try{
        const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
        let gr;
        try { gr = await GestureRecognizer.createFromOptions(vision, { baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task', delegate:'GPU' }, runningMode:'VIDEO', numHands:1 }); }
        catch(e){ gr = await GestureRecognizer.createFromOptions(vision, { baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' }, runningMode:'VIDEO', numHands:1 }); }
        hud.textContent='就绪：把手伸到镜头前，张开五指试试';
        running=true;
        const loop=()=>{
          if(!running) return;
          const now=performance.now();
          if(video.currentTime!==lastVideoTime && video.readyState>=2){
            lastVideoTime=video.currentTime;
            try{
              const res=gr.recognizeForVideo(video, now);
              const g=res.gestures && res.gestures[0] && res.gestures[0][0];
              if(g){
                const name=g.categoryName, score=Math.round(g.score*100);
                const open=/Open_Palm|ILoveYou/i.test(name);
                big.classList.toggle('on', open);
                hud.textContent='手势: '+name+' ('+score+'%)  '+(open?'✅ 已触发龙马显示':'');
              } else { big.classList.remove('on'); hud.textContent='未检测到手'; }
            }catch(e){ hud.textContent='识别异常: '+e.message; }
          }
          requestAnimationFrame(loop);
        };
        loop();
      }catch(e){ hud.textContent='模型加载失败: '+e.message; }
    });
  </script>
</body>
</html>
